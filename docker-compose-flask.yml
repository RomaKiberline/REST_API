version: '3.8'

services:
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile-flask
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/books"]
      interval: 30s
      timeout: 10s
      retries: 3
